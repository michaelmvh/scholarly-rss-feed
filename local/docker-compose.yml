services:
  scholar-rss:
    # Prebuilt image published by the GitHub Actions workflow.
    image: ghcr.io/michaelmvh/scholarly-rss-feed:latest
    # Build from the repository root for local development.
    build: ..
    container_name: scholar-rss
    environment:
      - GSRF_MAILTO=${GSRF_MAILTO:-}
      - GSRF_OPENALEX_API_KEY=${GSRF_OPENALEX_API_KEY:-}
      - GSRF_PROVIDER=${GSRF_PROVIDER:-openalex}
      - GSRF_CACHE_DIR=/cache
    volumes:
      - scholar-rss-cache:/cache
    ports:
      - "3005:3005"
    # feeds.toml is baked into the image, so no mount is required. To override the
    # baked config on the host without rebuilding, uncomment the mount below.
    # volumes:
    #   - ../feeds.toml:/config/feeds.toml:ro
    restart: unless-stopped

volumes:
  scholar-rss-cache:
