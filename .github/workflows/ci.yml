name: Check reader and static export

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo test --locked
      - run: npm ci
      - run: npm run typecheck:publisher
      - run: npm run check:publisher-compose
      - run: npm test
      - run: sh -n publisher/git-askpass.sh
      - name: Generate synthetic static preview
        run: cargo test --locked export_fixture -- --ignored
        env:
          GSRF_TEST_EXPORT_DIR: ${{ runner.temp }}/static-preview
          GSRF_TEST_SITE_URL: https://example.org/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          GSRF_TEST_EXPORT_DIR: ${{ runner.temp }}/static-preview
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-static-preview
          path: ${{ runner.temp }}/static-preview
          if-no-files-found: error

  publisher-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: publisher
          load: true
          tags: reading-publisher:test
          cache-from: type=gha,scope=publisher-ci
          cache-to: type=gha,mode=max,scope=publisher-ci
      - name: Check publisher image without a network or Docker socket
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp reading-publisher:test --help
          if output=$(docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp --entrypoint scholarly-rss-feed \
            reading-publisher:test --export /tmp/site --site-url https://example.org/ \
            --config /tmp/missing-feeds.toml 2>&1); then
            echo "Missing exporter configuration unexpectedly succeeded."
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'Static export requires a configured default_feed.'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp \
            -v "$PWD:/project:ro" -w /project --entrypoint node \
            reading-publisher:test --test tests/publisher.test.mts
