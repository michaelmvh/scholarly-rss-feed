name: Check reader and static export

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo test --locked
      - run: node --test tests/reader.test.cjs
      - name: Generate synthetic static preview
        run: cargo test --locked export_fixture -- --ignored
        env:
          GSRF_TEST_EXPORT_DIR: ${{ runner.temp }}/static-preview
          GSRF_TEST_SITE_URL: https://example.org/
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-static-preview
          path: ${{ runner.temp }}/static-preview
          if-no-files-found: error
