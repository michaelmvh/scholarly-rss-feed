services:
  exporter:
    image: ${STATIC_IMAGE:?Set STATIC_IMAGE to the reviewed exporter image tag or digest}
    environment:
      GSRF_MAILTO: ${GSRF_MAILTO:?Set the OpenAlex contact address}
      GSRF_PROVIDER: ${GSRF_PROVIDER:-openalex}
      GSRF_CACHE_DIR: /cache
    volumes:
      - discovery-cache:/cache
      - ${STATIC_RUN_DIR:?Set by publish-static.sh}:/work
      - ${PUBLISH_CHECKOUT:?Set the reading-site checkout path}:/previous:ro
    restart: "no"

  validator:
    image: node:24-bookworm-slim
    working_dir: /publisher
    environment:
      PREVIOUS_SITE: ${VALIDATION_PREVIOUS_SITE:-}
      ALLOW_FEED_SHRINK: ${ALLOW_FEED_SHRINK:-false}
    volumes:
      - ${PUBLISH_CHECKOUT:?Set the reading-site checkout path}:/publisher:ro
      - ${STATIC_RUN_DIR:?Set by publish-static.sh}:/candidate:ro
    tmpfs:
      - /publisher/node_modules
    command:
      - sh
      - -c
      - npm ci --ignore-scripts --no-audit --no-fund && node scripts/validate.ts /candidate/site
    restart: "no"

volumes:
  discovery-cache:
    external: true
    name: ${CACHE_VOLUME:?Set the dedicated static-export cache volume name}
