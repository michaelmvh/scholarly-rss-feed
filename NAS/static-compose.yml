services:
  publisher:
    image: ghcr.io/michaelmvh/scholarly-rss-feed-publisher:latest
    init: true
    env_file:
      - publisher.env
    environment:
      PUBLISH_STATE_DIR: /state
      PUBLISH_GITHUB_TOKEN_FILE: /run/secrets/github_token
      GSRF_OPENALEX_API_KEY_FILE: /run/secrets/openalex_api_key
    volumes:
      - ./state:/state
    secrets:
      - github_token
      - openalex_api_key
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

secrets:
  github_token:
    file: ./secrets/github-token.txt
  openalex_api_key:
    file: ./secrets/openalex-api-key.txt
